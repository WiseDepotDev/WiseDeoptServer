server:
    port: 8080
    servlet:
        encoding:
            charset: UTF-8
            force: true
            enabled: true

spring:
    application:
        name: wise-deopt-server
    # 本地敏感配置覆盖文件：config/application-local.yml（未入库，见 config/application-local.yml.example）。
    # 该文件不存在时 Spring 自动跳过，不会报错。
    profiles:
        include: local
    output:
        ansi:
            enabled: ALWAYS
    datasource:
        # 连接串本身不含凭据，保留本地默认值；服务器地址与账号口令由环境变量注入。
        url: ${WISE_DB_URL:jdbc:mysql://localhost:3306/wise_depot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&autoReconnect=true&failOverReadOnly=false&maxReconnects=10}
        username: ${WISE_DB_USERNAME:root}
        password: ${WISE_DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000
            connection-test-query: SELECT 1
    jpa:
        database-platform: org.hibernate.dialect.MySQLDialect
        hibernate:
            ddl-auto: update
        show-sql: false
    data:
        redis:
            # 单一来源：wise.redis.*（RedisConfig 用 RedisProperties 构建连接工厂），
            # spring.data.redis.* 由它派生，避免两处配置漂移。
            host: ${wise.redis.host}
            port: ${wise.redis.port}
            password: ${wise.redis.password}
            timeout: 5000
            lettuce:
                pool:
                    max-active: 8
                    max-idle: 8
                    min-idle: 0
                    max-wait: -1ms
    minio:
        endpoint: ${WISE_MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${WISE_MINIO_ACCESS_KEY}
        secret-key: ${WISE_MINIO_SECRET_KEY}
        secure: false
        bucket-name: ${WISE_MINIO_BUCKET:wise-depot}
        presigned-url-expiry: 3600
        max-file-size: 104857600
    # 决策 1B（2026-02-27）：原 `api.version: v1` 与 `api.base-path: /api/v1` 已删除——
    # 全仓没有任何代码或配置引用它们（实测 grep 0 命中），而 156/157 条路径实际都挂在 `/api` 下，
    # 只有健康检查曾被硬编码为 `/api/v1/health/minio`（已归一为 `/api/health/minio`）。
    # 正式前缀明确为 `/api`；若要版本化，走新增 `/api/v2` 路由，不再用"声明式前缀"。
    auth:
        admin:
            username: ${WISE_ADMIN_USERNAME:admin}
            password: ${WISE_ADMIN_PASSWORD}
            reset-password: ${WISE_ADMIN_RESET_PASSWORD:false}
        operator:
            username: ${WISE_OPERATOR_USERNAME:operator}
            password: ${WISE_OPERATOR_PASSWORD}

logging:
    level:
        root: INFO
        org.springframework: INFO
        org.hibernate: INFO
        com.huicang.wise: INFO
        com.huicang.wise.infrastructure.rfid: DEBUG
        com.huicang.wise.application.rfid: DEBUG
    pattern:
        console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

security:
    headers:
        x-frame-options: DENY
        x-content-type-options: nosniff
        x-xss-protection: "1; mode=block"
        content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self';"
        strict-transport-security: "max-age=31536000; includeSubDomains; preload"
        referrer-policy: "no-referrer-when-downgrade"
        permissions-policy: "geolocation=(), microphone=(), camera=()"

cors:
    allowed-origins: ${WISE_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://127.0.0.1:8080}
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
    allowed-headers: "*"
    exposed-headers: "Authorization,Content-Type,X-Requested-With,accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers"
    allow-credentials: true
    max-age: 3600

jwt:
    secret: ${WISE_JWT_SECRET}
    expiration:
        access: 7200
        refresh: 604800

api:
    signature:
        secret: ${WISE_API_SIGNATURE_SECRET}

rfid:
    server:
        port: 6606

# 登录失败节流与账户锁定（计数存 Redis，多实例一致）
wise:
    # Redis 连接：RedisConfig 通过 RedisProperties(prefix=wise.redis) 构建连接工厂，
    # 因此这里是 Redis 配置的**唯一来源**，spring.data.redis.* 由本块派生。
    # 口令无默认值：未注入 WISE_REDIS_PASSWORD 时启动即失败。
    redis:
        host: ${WISE_REDIS_HOST:localhost}
        port: ${WISE_REDIS_PORT:6379}
        password: ${WISE_REDIS_PASSWORD}
        database: ${WISE_REDIS_DATABASE:0}
        timeout: 5
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1
    login-attempt:
        # 同一账号连续失败多少次后锁定
        max-failures: 5
        # 计数与锁定的时间窗口（秒），900 = 15 分钟
        window-seconds: 900
        # 同一 IP 累计失败多少次后封禁（防撞库）
        max-failures-per-ip: 50

mqtt:
    broker:
        url: ${WISE_MQTT_URL:tcp://localhost:1883}
        username: ${WISE_MQTT_USERNAME:}
        password: ${WISE_MQTT_PASSWORD:}
        client-id: wise-server
        clean-session: true
        completion-timeout: 5000
        qos: 1
        inbound-topic: wise/device/+/report
        outbound-topic: wise/device/default/task

management:
    endpoints:
        web:
            exposure:
                include: health,info
            base-path: /actuator
    endpoint:
        health:
            show-details: always
            show-components: always
    health:
        defaults:
            enabled: true
